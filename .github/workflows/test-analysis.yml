name: Test analysis

on:
  push:
    branches:
      - fix/reproducible-ab-test-analysis
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q ab_test_analysis.py tests
      - name: Run unit tests
        run: python -m pytest -v
      - name: Execute analysis against repository dataset
        run: python ab_test_analysis.py
